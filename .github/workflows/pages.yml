name: Build and deploy Pages site

on:
  push:
    branches: ['**']
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # deploy-pages@v4 sometimes queries the artifact metadata before the
      # upload is visible ("Found 0 artifact(s)"); poll up to 5s to avoid it.
      - name: Wait for Pages artifact to register (max 5s)
        run: |
          for i in $(seq 1 10); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[].name' 2>/dev/null | grep -qx "github-pages"; then
              echo "github-pages artifact visible (poll $i)"
              exit 0
            fi
            sleep 0.5
          done
          echo "::warning::github-pages artifact still not visible after 5s; deploying anyway"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
