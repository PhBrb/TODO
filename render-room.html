<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO Room Render</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #d8e2f0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #room-container {
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="room-container"></div>
  
  <script type="importmap">
    { "imports": { "three": "./docs/vendor/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const ROOM_BG_COLOR = 0xd8e2f0;
    const CUBE_COLOR = 0x8b5cf6;
    const CUBE_SIZE = 1;
    const CAMERA_FOV = 40;
    const CAMERA_POSITION = [3, 2.6, 4];
    const CAMERA_TARGET = [0, 0, 0];
    const CUBE_ROTATION_PER_FRAME = { x: 0.004, y: 0.01 };
    const LIGHT_POSITION = [4, 6, 3];

    const container = document.getElementById('room-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(ROOM_BG_COLOR);

    const camera = new THREE.PerspectiveCamera(
      CAMERA_FOV,
      container.clientWidth / Math.max(1, container.clientHeight),
      0.1,
      100
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(...LIGHT_POSITION);
    scene.add(dirLight);

    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE),
      new THREE.MeshStandardMaterial({ color: CUBE_COLOR })
    );
    scene.add(cube);

    camera.position.set(...CAMERA_POSITION);
    camera.lookAt(...CAMERA_TARGET);

    function onResize() {
      const width = container.clientWidth;
      const height = Math.max(1, container.clientHeight);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }
    window.addEventListener('resize', onResize);

    let frameCount = 0;
    function animate() {
      frameCount++;
      cube.rotation.y += CUBE_ROTATION_PER_FRAME.y;
      cube.rotation.x += CUBE_ROTATION_PER_FRAME.x;
      renderer.render(scene, camera);
      
      if (frameCount >= 60) {
        console.log('Room fully rendered');
      }
      
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    window.renderComplete = true;
  </script>
</body>
</html>
